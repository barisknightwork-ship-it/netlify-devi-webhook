[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/webhook/devi"
  to = "/.netlify/functions/devi-webhook-queue"
  status = 200

[functions.devi-webhook-queue]
  path = "netlify/functions/devi-webhook-queue.js"

[functions.process-devi-queue]
  path = "netlify/functions/process-devi-queue.js"

[functions.trigger-analysis]
  path = "netlify/functions/trigger-analysis.js"

[functions.run-shom]
  path = "netlify/functions/run-shom.js"

[functions.run-koom]
  path = "netlify/functions/run-koom.js"

[[functions]]
  name = "trigger-analysis"
  schedule = "*/5 * * * *"
